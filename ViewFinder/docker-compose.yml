version: '3.8'

services:
  backend:
    build: ./backend
    container_name: viewfinder_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - CHOKIDAR_USEPOLLING=true

  frontend:
    build: ./frontend
    container_name: viewfinder_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - node_modules_volume:/app/node_modules
    environment:
      - VITE_API_URL=http://backend:8000   # Use Docker service name, NOT localhost
    depends_on:
      - backend

volumes:
  node_modules_volume: